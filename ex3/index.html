<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biểu mẫu đăng nhập</title>


    <!-- ================= BOOTSTRAP CSS ================= -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- ================= FONT AWESOME ================= -->

    <!-- index.html nằm trong ex3 -->
    <!-- css nằm cùng cấp với index.html -->

    <link rel="stylesheet" href="css/all.min.css">


    <!-- ================= CSS TÙY CHỈNH ================= -->

    <style>
        /* Kích thước icon trong Inline Form */
        .inline-icon {
            width: 38px;
            justify-content: center;
        }


        /* Tiêu đề Modal */
        .modal-login-title {
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: 400;
        }


        /* Icon ổ khóa ở tiêu đề Modal */
        .modal-login-title i {
            font-size: 18px;
            margin-right: 5px;
        }


        /* Label trong Modal */
        .login-modal-label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }


        /* Chữ trong Modal */
        .login-modal-text {
            font-size: 13px;
        }


        /* Footer Modal */
        .login-modal-footer {
            font-size: 12px;
        }
    </style>

</head>


<body class="bg-light">


    <!-- ================================================= -->
    <!-- CONTAINER -->
    <!-- ================================================= -->

    <div class="container py-5">


        <!-- ================================================= -->
        <!-- 1. HORIZONTAL FORM -->
        <!-- ================================================= -->

        <div class="row justify-content-center mb-5">

            <div class="col-12 col-md-8 col-lg-7">

                <div class="card border-info shadow-sm">


                    <!-- HEADER -->

                    <div class="card-header bg-info-subtle text-info-emphasis">

                        Biểu mẫu đăng nhập

                    </div>


                    <!-- BODY -->

                    <div class="card-body">

                        <form>


                            <!-- EMAIL -->

                            <div class="row mb-3">

                                <label for="emailHorizontal" class="col-sm-3 col-form-label fw-bold">
                                    Email:
                                </label>

                                <div class="col-sm-9">

                                    <input type="email" class="form-control" id="emailHorizontal"
                                        placeholder="Nhập vào email">

                                </div>

                            </div>


                            <!-- MẬT KHẨU -->

                            <div class="row mb-3">

                                <label for="passwordHorizontal" class="col-sm-3 col-form-label fw-bold">
                                    Mật khẩu:
                                </label>

                                <div class="col-sm-9">

                                    <input type="password" class="form-control" id="passwordHorizontal"
                                        placeholder="Nhập vào mật khẩu">

                                </div>

                            </div>


                            <!-- GHI NHỚ -->

                            <div class="row mb-3">

                                <div class="offset-sm-3 col-sm-9">

                                    <div class="form-check">

                                        <input class="form-check-input" type="checkbox" id="rememberHorizontal">

                                        <label class="form-check-label" for="rememberHorizontal">
                                            Ghi nhớ tôi
                                        </label>

                                    </div>

                                </div>

                            </div>


                            <!-- ĐĂNG NHẬP -->

                            <div class="row">

                                <div class="offset-sm-3 col-sm-9">

                                    <button type="submit" class="btn btn-primary">
                                        Đăng nhập
                                    </button>

                                </div>

                            </div>


                        </form>

                    </div>

                </div>

            </div>

        </div>



        <!-- ================================================= -->
        <!-- 2. VERTICAL FORM -->
        <!-- ================================================= -->

        <div class="row justify-content-center mb-5">

            <div class="col-12 col-md-8 col-lg-7">

                <div class="card border-info shadow-sm">


                    <!-- HEADER -->

                    <div class="card-header bg-info-subtle text-info-emphasis">

                        Biểu mẫu đăng nhập

                    </div>


                    <!-- BODY -->

                    <div class="card-body">

                        <form>


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label for="emailVertical" class="form-label fw-bold">
                                    Email:
                                </label>

                                <input type="email" class="form-control" id="emailVertical"
                                    placeholder="Nhập vào email">

                            </div>


                            <!-- PASSWORD -->

                            <div class="mb-3">

                                <label for="passwordVertical" class="form-label fw-bold">
                                    Password:
                                </label>

                                <input type="password" class="form-control" id="passwordVertical"
                                    placeholder="Nhập vào mật khẩu">

                            </div>


                            <!-- GHI NHỚ -->

                            <div class="mb-3">

                                <div class="form-check">

                                    <input class="form-check-input" type="checkbox" id="rememberVertical">

                                    <label class="form-check-label" for="rememberVertical">
                                        Ghi nhớ tôi
                                    </label>

                                </div>

                            </div>


                            <!-- ĐĂNG NHẬP -->

                            <button type="submit" class="btn btn-primary">
                                Đăng nhập
                            </button>


                        </form>

                    </div>

                </div>

            </div>

        </div>



        <!-- ================================================= -->
        <!-- 3. INLINE FORM -->
        <!-- ================================================= -->

        <div class="row justify-content-center mb-5">

            <div class="col-12">

                <div class="card border-primary shadow-sm">


                    <!-- HEADER -->

                    <div class="card-header bg-primary text-white">

                        Biểu mẫu đăng nhập

                    </div>


                    <!-- BODY -->

                    <div class="card-body">

                        <form class="row g-2 align-items-center">


                            <!-- EMAIL -->

                            <div class="col-auto">

                                <div class="input-group">


                                    <!-- ICON USER -->

                                    <span class="input-group-text inline-icon">

                                        <i class="fas fa-user"></i>

                                    </span>


                                    <input type="email" class="form-control" placeholder="Nhập vào email">

                                </div>

                            </div>



                            <!-- MẬT KHẨU -->

                            <div class="col-auto">

                                <div class="input-group">


                                    <!-- ICON LOCK -->

                                    <span class="input-group-text inline-icon">

                                        <i class="fas fa-lock"></i>

                                    </span>


                                    <input type="password" class="form-control" placeholder="Nhập vào mật khẩu">

                                </div>

                            </div>



                            <!-- GHI NHỚ -->

                            <div class="col-auto">

                                <div class="form-check">

                                    <input class="form-check-input" type="checkbox" id="rememberInline">

                                    <label class="form-check-label" for="rememberInline">
                                        Ghi nhớ tôi
                                    </label>

                                </div>

                            </div>



                            <!-- ĐĂNG NHẬP -->

                            <div class="col-auto">

                                <button type="submit" class="btn btn-primary">
                                    Đăng nhập
                                </button>

                            </div>


                        </form>

                    </div>

                </div>

            </div>

        </div>



        <!-- ================================================= -->
        <!-- 4. LOGIN MODAL -->
        <!-- ================================================= -->

        <div class="row justify-content-center mb-5">

            <div class="col-12 col-md-8 col-lg-6">


                <div class="card border-danger">


                    <div class="card-body">


                        <h2 class="mb-3">

                            Mở biểu mẫu đăng nhập

                        </h2>


                        <!-- NÚT MỞ MODAL -->

                        <button type="button" class="btn btn-info text-white" data-bs-toggle="modal"
                            data-bs-target="#loginModal">

                            Mở hộp thoại

                        </button>


                    </div>


                </div>


            </div>

        </div>


    </div>



    <!-- ================================================= -->
    <!-- LOGIN MODAL -->
    <!-- ================================================= -->

    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">


        <div class="modal-dialog">


            <div class="modal-content">


                <!-- ========================================= -->
                <!-- MODAL HEADER -->
                <!-- ========================================= -->

                <div class="modal-header py-2">


                    <h4 class="modal-title modal-login-title" id="loginModalLabel">

                        <!-- ICON Ổ KHÓA -->

                        <i class="fas fa-lock"></i>

                        Đăng nhập

                    </h4>


                    <!-- NÚT X -->

                    <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="modal"
                        aria-label="Close"></button>


                </div>



                <!-- ========================================= -->
                <!-- MODAL BODY -->
                <!-- ========================================= -->

                <div class="modal-body pt-3 pb-2">


                    <form>


                        <!-- ================= NGƯỜI DÙNG ================= -->

                        <div class="mb-2">


                            <label for="usernameModal" class="form-label login-modal-label">

                                <i class="fas fa-user"></i>

                                Người dùng:

                            </label>


                            <input type="text" class="form-control" id="usernameModal"
                                placeholder="Nhập tên người dùng">


                        </div>



                        <!-- ================= MẬT KHẨU ================= -->

                        <div class="mb-2">


                            <label for="passwordModal" class="form-label login-modal-label">
                                <i class="fas fa-eye"></i>
                                Mật khẩu:
                            </label>


                            <input type="password" class="form-control" id="passwordModal" placeholder="Nhập mật khẩu">


                        </div>



                        <!-- ================= GHI NHỚ ================= -->

                        <div class="form-check mb-2">


                            <input class="form-check-input" type="checkbox" id="rememberModal">


                            <label class="form-check-label login-modal-text" for="rememberModal">

                                Ghi nhớ tôi

                            </label>


                        </div>



                        <!-- ================= ĐĂNG NHẬP ================= -->

                        <button type="submit" class="btn btn-success w-100">

                            <i class="fas fa-power-off"></i>

                            Đăng nhập

                        </button>


                    </form>


                </div>



                <!-- ========================================= -->
                <!-- MODAL FOOTER -->
                <!-- ========================================= -->

                <div class="modal-footer py-2">


                    <!-- HỦY BỎ -->

                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">

                        <i class="fas fa-times"></i>

                        Hủy bỏ

                    </button>



                    <!-- ĐĂNG KÝ + QUÊN MẬT KHẨU -->

                    <div class="text-end ms-auto login-modal-footer">


                        <div>

                            Bạn chưa phải là thành viên?

                            <a href="#">
                                Đăng ký
                            </a>

                        </div>


                        <div>

                            <a href="#">
                                Quên mật khẩu?
                            </a>

                        </div>


                    </div>


                </div>


            </div>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- BOOTSTRAP JAVASCRIPT -->
    <!-- ================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
